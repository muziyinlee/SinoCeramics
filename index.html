<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OrientKiln - A curated digital exhibition exploring the profound history, artistry, and aesthetic philosophy embedded within classical Chinese ceramics and porcelain across dynasties." />
    <meta name="keywords" content="Chinese ceramics, porcelain, art history, classical Chinese art, oriental kiln, imperial kilns, Ru ware, Tang Sancai, Jian ware, Dehua porcelain" />
    <meta property="og:title" content="OrientKiln | Classical Chinese Ceramic Heritage" />
    <meta property="og:description" content="A curated digital exhibition exploring the profound history, artistry, and aesthetic philosophy embedded within classical Chinese ceramics." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OrientKiln | Chinese Ceramic Heritage</title>
    <!-- Google AdSense - Uncomment the line below when you are ready to apply for review -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8443500829259154" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root">
      <style>
        @keyframes fade-pulse {
          0%, 100% { opacity: 0.3; }
          50% { opacity: 1; }
        }
        @keyframes spin-slow {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        .loading-container {
          position: fixed;
          inset: 0;
          background-color: #0a0a0a;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: 'Inter', system-ui, sans-serif;
        }
        .loading-spinner {
          width: 40px;
          height: 40px;
          border: 1px solid rgba(191, 154, 77, 0.2);
          border-top-color: #bf9a4d;
          border-radius: 50%;
          animation: spin-slow 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
          margin-bottom: 24px;
        }
        .loading-text {
          color: #bf9a4d;
          font-size: 11px;
          letter-spacing: 0.3em;
          text-transform: uppercase;
          animation: fade-pulse 2s ease-in-out infinite;
        }
        .loading-brand {
          color: #ffffff;
          font-size: 18px;
          letter-spacing: 0.25em;
          font-weight: 300;
          margin-bottom: 32px;
          text-transform: uppercase;
        }
      </style>
      <div class="loading-container">
        <div class="loading-brand">Orient<span style="color: #bf9a4d">Kiln</span></div>
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
